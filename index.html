<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>セキュリティ学習DB</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>🔐 セキュリティ学習DB</h1>

    <p class="subtitle">
        セキュリティマネジメント試験の学習記録
    </p>

    <div class="progress-area">

        <h2>学習進捗</h2>

        <div class="progress-summary">

            <div class="progress-card">
                <span class="count" id="total-count">0</span>
                <span class="label">全用語</span>
            </div>

            <div class="progress-card">
                <span class="count" id="not-started-count">0</span>
                <span class="label">未学習</span>
            </div>

            <div class="progress-card">
                <span class="count" id="learning-count">0</span>
                <span class="label">学習中</span>
            </div>

            <div class="progress-card">
                <span class="count" id="completed-count">0</span>
                <span class="label">理解済み</span>
            </div>

        </div>

        <p id="progress-percent" class="progress-percent">
            理解済み：0%
        </p>

        <div class="progress-bar">
            <div id="progress-bar-fill"></div>
        </div>

        <section id="study-history-section">
    <h2>📅 学習記録</h2>

    <div class="study-stats">
        <div class="study-stat-card">
            <span class="study-stat-label">連続学習日数</span>
            <strong id="study-streak">0日</strong>
        </div>

        <div class="study-stat-card">
            <span class="study-stat-label">累計学習日数</span>
            <strong id="study-total-days">0日</strong>
        </div>
    </div>

    <button id="record-study-button" type="button">
        ✅ 今日の学習を記録
    </button>

    <p id="study-record-message" aria-live="polite"></p>

    <h3>直近7日間の学習履歴</h3>
    <div id="study-history-calendar" class="study-history-calendar"></div>
</section>

<div class="learning-summary-item">
    <span class="summary-label">復習対象</span>
    <span class="summary-count" id="summary-review">0</span>
</div>

        <div class="learning-summary">
            <div class="learning-summary-item">
                <span class="summary-label">未学習</span>
                <span class="summary-count" id="summary-not-started">0</span>
            </div>

            <div class="learning-summary-item">
                <span class="summary-label">学習中</span>
                <span class="summary-count" id="summary-learning">0</span>
            </div>

            <div class="learning-summary-item">
                <span class="summary-label">理解済み</span>
                <span class="summary-count" id="summary-completed">0</span>
            </div>
        </div>

    </div>

    <h2>用語一覧</h2>

    <div class="action-buttons">
        <button id="add-term-button">
            ＋ 新しい用語を追加
        </button>

        <button id="backup-button">
            ↓ 学習データをバックアップ
        </button>

        <button id="restore-button">
            ↑ 学習データを復元
        </button>

        <input type="file" id="backup-file" accept=".json,application/json" hidden>
    </div>

    <button id="review-mode-button" type="button">
        復習モード：OFF
    </button>

    <div class="search-area">

        <input type="text" id="search-input" placeholder="用語を検索...">

        <select id="category-select">
            <option value="all">すべての分野</option>
        </select>

        <select id="sort-select">
            <option value="reading">五十音順</option>
            <option value="alphabet">A-Z順</option>
        </select>

        <select id="status-select">
            <option value="all">すべての学習状況</option>
            <option value="未学習">未学習</option>
            <option value="学習中">学習中</option>
            <option value="理解済み">理解済み</option>
        </select>
    </div>

    <div id="term-list" class="term-list"></div>

    <script src="terms.js"></script>
    <script src="script.js"></script>

</body>

</html>
